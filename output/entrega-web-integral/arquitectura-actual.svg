  <text x="94" y="294" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">Personal de la clínica</text>
  <text x="94" y="329" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Administración · Recepción</text>
  <text x="94" y="357" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Dentista · Soporte</text>
  <text x="94" y="387" fill="#698195" font-family="Arial, sans-serif" font-size="14">Acceso según rol y permisos</text>

  <g filter="url(#shadow)"><rect x="460" y="250" width="330" height="158" rx="18" fill="#FFFFFF" stroke="#91B9D6" stroke-width="2"/></g>
  <rect x="460" y="250" width="330" height="9" rx="4" fill="#2B6DAA"/>
  <text x="484" y="294" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">Web · Next.js / React</text>
  <text x="484" y="329" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Panel, agenda, atenciones</text>
  <text x="484" y="357" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">reportes y configuración</text>
  <text x="484" y="387" fill="#698195" font-family="Arial, sans-serif" font-size="14">Interfaz responsiva</text>

  <g filter="url(#shadow)"><rect x="870" y="250" width="330" height="158" rx="18" fill="#FFFFFF" stroke="#91B9D6" stroke-width="2"/></g>
  <rect x="870" y="250" width="330" height="9" rx="4" fill="#2B6DAA"/>
  <text x="894" y="294" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">API clínica · Fastify</text>
  <text x="894" y="329" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">REST /api/v1 · sesiones web</text>
  <text x="894" y="357" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Citas, RFID, analítica y CSV</text>
  <text x="894" y="387" fill="#698195" font-family="Arial, sans-serif" font-size="14">Autorización en servidor</text>

  <g filter="url(#shadow)"><rect x="870" y="485" width="330" height="115" rx="18" fill="#FFFFFF" stroke="#91B9D6" stroke-width="2"/></g>
  <rect x="870" y="485" width="330" height="9" rx="4" fill="#2B6DAA"/>
  <text x="894" y="527" fill="#163C57" font-family="Arial, sans-serif" font-size="22" font-weight="700">Adaptador RFID</text>
  <text x="894" y="557" fill="#4B6578" font-family="Arial, sans-serif" font-size="16">Evento UID + estación</text>
  <text x="894" y="582" fill="#698195" font-family="Arial, sans-serif" font-size="14">Lector físico por validar</text>

  <!-- Shared persistence -->
  <g filter="url(#shadow)"><rect x="1390" y="355" width="340" height="240" rx="18" fill="#FFFFFF" stroke="#78AEBF" stroke-width="2"/></g>
  <rect x="1390" y="355" width="340" height="9" rx="4" fill="#1F8B9A"/>
  <text x="1414" y="399" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">PostgreSQL</text>
  <text x="1414" y="429" fill="#247582" font-family="Arial, sans-serif" font-size="18" font-weight="700">Base única: dentalrisk</text>
  <line x1="1414" y1="449" x2="1706" y2="449" stroke="#D6E6EB" stroke-width="2"/>
  <text x="1414" y="480" fill="#4B6578" font-family="Arial, sans-serif" font-size="16">Identidad compartida: users</text>
  <text x="1414" y="509" fill="#4B6578" font-family="Arial, sans-serif" font-size="16">Citas, atenciones y catálogos</text>
  <text x="1414" y="538" fill="#4B6578" font-family="Arial, sans-serif" font-size="16">Sesiones y auditoría: agent_*</text>
  <text x="1414" y="571" fill="#698195" font-family="Arial, sans-serif" font-size="14">Roles de conexión diferenciados</text>

  <!-- Agent lane -->
  <g filter="url(#shadow)"><rect x="70" y="670" width="330" height="155" rx="18" fill="#FFFFFF" stroke="#D9B578" stroke-width="2"/></g>
  <rect x="70" y="670" width="330" height="9" rx="4" fill="#B87511"/>
  <text x="94" y="714" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">Chat en el ESP</text>
  <text x="94" y="748" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Modelo y habilidad dentalrisk</text>
  <text x="94" y="777" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Consulta, alta y foto</text>
  <text x="94" y="808" fill="#A76B16" font-family="Arial, sans-serif" font-size="14" font-weight="700">Delegación actual requiere renovar</text>

  <g filter="url(#shadow)"><rect x="870" y="670" width="330" height="155" rx="18" fill="#FFFFFF" stroke="#91B9D6" stroke-width="2"/></g>
  <rect x="870" y="670" width="330" height="9" rx="4" fill="#2B6DAA"/>
  <text x="894" y="714" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">API agente · FastAPI</text>
  <text x="894" y="748" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">JWT + clave delegada del ESP</text>
  <text x="894" y="777" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Usuarios y registros permitidos</text>
  <text x="894" y="808" fill="#698195" font-family="Arial, sans-serif" font-size="14">Sin chat ni inferencia en servidor</text>

  <g filter="url(#shadow)"><rect x="1390" y="690" width="340" height="135" rx="18" fill="#FFFFFF" stroke="#78AEBF" stroke-width="2"/></g>
  <rect x="1390" y="690" width="340" height="9" rx="4" fill="#1F8B9A"/>
  <text x="1414" y="734" fill="#163C57" font-family="Arial, sans-serif" font-size="24" font-weight="700">MinIO privado</text>
  <text x="1414" y="769" fill="#4B6578" font-family="Arial, sans-serif" font-size="17">Fotos JPEG de perfil</text>
  <text x="1414" y="800" fill="#698195" font-family="Arial, sans-serif" font-size="14">Acceso mediante API autenticada</text>

  <line x1="70" y1="883" x2="1730" y2="883" stroke="#CCDDE8" stroke-width="2"/>
  <path d="M72 917 H132" stroke="#2B6DAA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="146" y="923" fill="#526D80" font-family="Arial, sans-serif" font-size="16">Conexión implementada</text>
  <path d="M403 917 H463" stroke="#B87511" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrowAmber)"/>
  <text x="477" y="923" fill="#526D80" font-family="Arial, sans-serif" font-size="16">Revinculación del ESP pendiente</text>
  <text x="70" y="965" fill="#526D80" font-family="Arial, sans-serif" font-size="16">Alcance: instalación local y diseño implementado. El lector físico, el despliegue conjunto de producción y el piloto clínico siguen pendientes.</text>
</svg>
