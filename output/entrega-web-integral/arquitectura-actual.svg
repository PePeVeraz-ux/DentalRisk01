<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura actual de DentalRisk y Agente IA</title>
  <desc id="desc">Diagrama de la instalación local: usuarios y Next.js conectados a Fastify; adaptador RFID a Fastify; chat en ESP conectado a FastAPI con revinculación pendiente; ambos servicios usan una base PostgreSQL compartida y FastAPI usa MinIO para imágenes privadas.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#2B6DAA"/></marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#B87511"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#123A5A" flood-opacity=".10"/></filter>
  </defs>

  <rect width="1800" height="1000" fill="#F6F9FC"/>
  <rect width="1800" height="132" fill="#123A5A"/>
  <rect x="70" y="31" width="8" height="68" rx="4" fill="#63C3E5"/>
  <text x="104" y="65" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="33" font-weight="700">Arquitectura actual · DentalRisk + Agente IA</text>
  <text x="104" y="101" fill="#D8E7F2" font-family="Arial, sans-serif" font-size="18">Instalación local compartida · esquema documentado el 9 de noviembre de 2026</text>
  <rect x="1504" y="44" width="226" height="43" rx="21" fill="#E3F3F9"/>
  <text x="1617" y="72" text-anchor="middle" fill="#145677" font-family="Arial, sans-serif" font-size="16" font-weight="700">ESTADO LOCAL</text>

  <text x="70" y="187" fill="#507188" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">PERSONAS Y DISPOSITIVOS</text>
  <text x="870" y="187" fill="#507188" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SERVICIOS</text>
  <text x="1390" y="187" fill="#507188" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DATOS Y ARCHIVOS</text>

  <rect x="54" y="207" width="755" height="238" rx="25" fill="#EAF2F8"/>
  <rect x="853" y="207" width="867" height="238" rx="25" fill="#EAF2F8"/>
  <rect x="54" y="644" width="755" height="202" rx="25" fill="#EFF5F9"/>
  <rect x="853" y="644" width="867" height="202" rx="25" fill="#EFF5F9"/>

  <!-- Connections are drawn behind nodes. -->
  <path d="M400 325 H460" fill="none" stroke="#2B6DAA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M790 325 H870" fill="none" stroke="#2B6DAA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1200 325 H1302 V430 H1390" fill="none" stroke="#2B6DAA" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
  <path d="M1035 485 V410" fill="none" stroke="#2B6DAA" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M400 747 H870" fill="none" stroke="#B87511" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrowAmber)"/>
  <path d="M1200 710 H1302 V542 H1390" fill="none" stroke="#2B6DAA" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
  <path d="M1200 780 H1390" fill="none" stroke="#2B6DAA" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <text x="411" y="238" fill="#456B86" font-family="Arial, sans-serif" font-size="14">navegador</text>
  <text x="795" y="309" fill="#456B86" font-family="Arial, sans-serif" font-size="14">REST</text>
  <text x="1220" y="308" fill="#456B86" font-family="Arial, sans-serif" font-size="14">SQL</text>
  <text x="1054" y="460" fill="#456B86" font-family="Arial, sans-serif" font-size="14">UID</text>
  <text x="483" y="726" fill="#A76B16" font-family="Arial, sans-serif" font-size="16" font-weight="700">HTTP · revinculación pendiente</text>
  <text x="1218" y="688" fill="#456B86" font-family="Arial, sans-serif" font-size="14">SQL limitado</text>
  <text x="1261" y="763" fill="#456B86" font-family="Arial, sans-serif" font-size="14">JPEG privado</text>

